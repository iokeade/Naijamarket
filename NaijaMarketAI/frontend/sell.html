<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sell - NaijaMarket AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <header class="header">

        <div class="nav-container">

            <a href="index.html" class="logo">
                🇳🇬 NaijaMarket <span>AI</span>
            </a>

            <nav class="navigation">

                <a href="index.html">Home</a>

                <a href="marketplace.html">
                    Marketplace
                </a>

                <a href="sell.html">
                    Sell
                </a>

                <a href="messages.html">
                    Messages
                </a>

                <a href="cart.html">
                    🛒 Cart
                </a>

                <a href="profile.html">
                    👤 Account
                </a>

            </nav>

        </div>

    </header>


    <main class="container">


        <section class="page-header">

            <h1>
                Sell an Item
            </h1>

            <p>
                Create a listing and reach buyers across Nigeria.
            </p>

        </section>


        <section class="card">

            <form id="sellForm">


                <div class="form-group">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        placeholder="e.g. Rice 50kg"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select required>

                        <option value="">
                            Select Category
                        </option>

                        <option>
                            Food
                        </option>

                        <option>
                            Electronics
                        </option>

                        <option>
                            Fashion
                        </option>

                        <option>
                            Vehicles
                        </option>

                        <option>
                            Farm Products
                        </option>

                        <option>
                            Home
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Price (₦)
                    </label>

                    <input
                        type="number"
                        placeholder="e.g. 72000"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Condition
                    </label>

                    <select required>

                        <option value="">
                            Select Condition
                        </option>

                        <option>
                            New
                        </option>

                        <option>
                            Used
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <input
                        type="text"
                        placeholder="e.g. Mile 12, Lagos"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        rows="6"
                        placeholder="Describe your product..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Quantity Available
                    </label>

                    <input
                        type="number"
                        min="1"
                        placeholder="e.g. 20"
                        required
                    >

                </div>


                <div class="upload-box">

                    📷

                    <p>
                        Add product photos
                    </p>

                    <input
                        type="file"
                        accept="image/*"
                        multiple
                    >

                </div>


                <button type="submit">
                    Publish Listing
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            NaijaMarket AI © 2026
        </p>

    </footer>


    <script src="app.js"></script>

</body>

</html>
