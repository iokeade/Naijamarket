<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Cart - NaijaMarket </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <header class="header">

        <div class="nav-container">

            <a href="index.html" class="logo">
                🇳🇬 NaijaMarket <span>AI</span>
            </a>

            <nav class="navigation">

                <a href="index.html">Home</a>

                <a href="marketplace.html">
                    Marketplace
                </a>

                <a href="sell.html">
                    Sell
                </a>

                <a href="messages.html">
                    Messages
                </a>

                <a href="cart.html">
                    🛒 Cart
                </a>

                <a href="profile.html">
                    👤 Account
                </a>

            </nav>

        </div>

    </header>


    <main class="container">


        <section class="page-header">

            <h1>
                🛒 My Cart
            </h1>

            <p>
                Review your items before checkout.
            </p>

        </section>


        <section class="card">


            <div class="cart-item">

                <div class="cart-image">
                    🍚
                </div>


                <div class="cart-info">

                    <h3>
                        Rice - 50kg Bag
                    </h3>

                    <p>
                        John Market Store
                    </p>

                    <p class="product-price">
                        ₦72,000
                    </p>


                    <div class="quantity">

                        <button>
                            −
                        </button>

                        <span>
                            1
                        </span>

                        <button>
                            +
                        </button>

                    </div>

                </div>


                <button class="remove-button">
                    Remove
                </button>

            </div>


            <hr>


            <div class="cart-summary">

                <p>
                    Subtotal:
                    <strong>₦72,000</strong>
                </p>

                <p>
                    Delivery:
                    <strong>₦3,000</strong>
                </p>

                <h2>
                    Total:
                    ₦75,000
                </h2>


                <button>
                    Proceed to Checkout
                </button>

            </div>

        </section>

    </main>


    <footer>

        <p>
            NaijaMarket AI © 2026
        </p>

    </footer>


    <script src="app.js"></script>

</body>

</html>
